name: Build SongRequestManagerV2

on:
  workflow_dispatch:
  push:
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.props'
      - '**.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.props'
      - '**.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build BS ${{ matrix.game-version }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - game-version: 1.40.8

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Initialize Beat Saber references
        uses: beat-forge/init-beatsaber@v1
        with:
          token: ${{ github.token }}
          version: ${{ matrix.game-version }}
          path: ${{ github.workspace }}\Refs

      - name: Download BeatMods dependencies
        uses: Aeroluna/download-beatmods-deps@main
        with:
          game-version: ${{ matrix.game-version }}
          project-path: SongRequestManagerV2/SongRequestManagerV2.csproj
          project-configuration: Release
          path: ${{ github.workspace }}\Refs
          additional-dependencies: '{"SongCore":"^3.14.15","CatCore":"^1.1.0","SiraUtil":"^3.1.14","BeatSaberMarkupLanguage":"^1.12.3"}'

      - name: Restore dependencies
        run: dotnet restore SongRequestManagerV2.sln -p:BeatSaberDir=${{ github.workspace }}\Refs

      - name: Build
        run: >-
          dotnet build SongRequestManagerV2.sln
          --configuration Release
          --no-restore
          -p:BeatSaberGameVersion=${{ matrix.game-version }}
          -p:BeatSaberDir=${{ github.workspace }}\Refs
          -p:GameDirectory=${{ github.workspace }}\artifacts
          -p:ArtifactDestination=${{ github.workspace }}\artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SongRequestManagerV2-bs${{ matrix.game-version }}
          path: |
            artifacts/Plugins/SongRequestManagerV2.dll
            artifacts/Plugins/SongRequestManagerV2.pdb
            artifacts/UserData/**
